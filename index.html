<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Forge — a premium workout tracker. Log sets, follow your split, track PRs, body weight and progress." />

    <!-- iOS home-screen app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Forge" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Forge</title>
    <script>
      // Apply the saved theme before first paint (mirrors src/lib/theme.ts).
      (function () {
        var pref = 'dark';
        try {
          var s = JSON.parse(localStorage.getItem('forge:data') || '{}');
          pref = (s.state && s.state.settings && s.state.settings.theme) || 'dark';
        } catch (e) {}
        var dark = pref === 'system' ? !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches : pref !== 'light';
        var t = dark ? 'dark' : 'light';
        var d = document.documentElement;
        d.setAttribute('data-theme', t);
        d.style.colorScheme = t;
        document.querySelector('meta[name="theme-color"]').content = dark ? '#000000' : '#f2f2f7';
        document.querySelector('meta[name="color-scheme"]').content = t;
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = dark ? 'black-translucent' : 'default';
      })();
    </script>
    <style>
      /* Paint the theme background immediately to avoid a flash before CSS loads. */
      html, body { background: #000; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f2f2f7; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Forge needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
